<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>关于 · 半夏叁分</title>
  <style>
    :root {
      --ink: #2c2c2c;
      --ink-light: #5a5a5a;
      --ink-lighter: #999;
      --paper: #f5f0e8;
      --paper-dark: #ede6d8;
      --red: #b33a3a;
      --plum: #d4a5a5;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", Georgia, serif;
      color: var(--ink);
      background: var(--paper);
      line-height: 2;
      font-size: 16px;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }
    .plum-branch {
      position: fixed;
      top: 0;
      right: 0;
      width: 420px;
      z-index: 1;
      pointer-events: none;
      opacity: 0.9;
      mix-blend-mode: multiply;
      -webkit-mask-image: radial-gradient(ellipse 120% 100% at 100% 0%, black 40%, transparent 100%);
      mask-image: radial-gradient(ellipse 120% 100% at 100% 0%, black 40%, transparent 100%);
      transform-origin: 100% 0%;
      animation: branch-sway 6s ease-in-out infinite;
    }
    @keyframes branch-sway {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(0.8deg); }
      50% { transform: rotate(0deg); }
      75% { transform: rotate(-0.5deg); }
    }
    nav {
      position: relative;
      z-index: 10;
      max-width: 720px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid var(--paper-dark);
    }
    nav .brand {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--ink);
      text-decoration: none;
      letter-spacing: 0.15em;
    }
    nav .links { display: flex; gap: 2rem; }
    nav .links a {
      color: var(--ink-light);
      text-decoration: none;
      font-size: 0.9rem;
      letter-spacing: 0.1em;
    }
    nav .links a:hover, nav .links a.active { color: var(--red); }
    main {
      position: relative;
      z-index: 10;
      max-width: 680px;
      margin: 0 auto;
      padding: 3rem 1.5rem;
    }
    h1 { font-size: 1.8rem; font-weight: 600; margin-bottom: 1.5rem; letter-spacing: 0.1em; }
    h2 { font-size: 1.1rem; font-weight: 600; margin: 2rem 0 0.8rem; }
    p { margin-bottom: 1rem; }
    .seal {
      display: inline-block;
      width: 28px; height: 28px;
      background: var(--red); color: #fff;
      font-size: 0.7rem; line-height: 28px;
      text-align: center; border-radius: 3px;
      margin-left: 0.5rem; vertical-align: middle;
    }
    footer {
      position: relative; z-index: 10;
      max-width: 680px; margin: 0 auto;
      padding: 2rem 1.5rem 3rem;
      text-align: center; color: var(--ink-lighter);
      font-size: 0.8rem; border-top: 1px solid var(--paper-dark);
    }
    .petals { position: fixed; inset: 0; pointer-events: none; z-index: 5; overflow: hidden; }
    .petal {
      position: absolute; top: -20px; font-size: 14px; color: var(--plum);
      opacity: 0; animation: petal-fall linear infinite;
    }
    @keyframes petal-fall {
      0% { transform: translateY(-20px) translateX(0) rotate(0deg); opacity: 0; }
      10% { opacity: 0.8; }
      90% { opacity: 0.6; }
      100% { transform: translateY(100vh) translateX(80px) rotate(360deg); opacity: 0; }
    }
  </style>
</head>
<body>
  <img src="assets/plum-branch-converted.svg" alt="" class="plum-branch">
  <div class="petals" id="petals"></div>
  <nav>
    <a href="index.html" class="brand">半夏叁分<span class="seal">印</span></a>
    <div class="links">
      <a href="index.html">首页</a>
      <a href="about.html" class="active">关于</a>
      <a href="blog.html">博客</a>
    </div>
  </nav>
  <main>
    <h1>关于半夏叁分</h1>
    <p>你好，我是一名热爱文字与技术的写作者。</p>
    <h2>兴趣</h2>
    <p>📖 阅读与写作<br>💻 软件开发<br>🏔️ 登山与旅行<br>🍵 茶文化</p>
    <h2>联系</h2>
    <p>邮箱：your.email@example.com<br>GitHub：yourusername</p>
    <p style="color:var(--ink-lighter);margin-top:2rem;">— 人生海海，山山而川。</p>
  </main>
  <footer>© 2026 半夏叁分 · 笔墨余生，以文会友</footer>
  <script>
    (function() {
      const c = document.getElementById('petals');
      for (let i = 0; i < 12; i++) {
        const p = document.createElement('div');
        p.className = 'petal'; p.textContent = '❀';
        p.style.left = Math.random() * 100 + '%';
        p.style.animationDuration = (8 + Math.random() * 8) + 's';
        p.style.animationDelay = (Math.random() * 10) + 's';
        c.appendChild(p);
      }
    })();
  </script>
</body>
</html>
