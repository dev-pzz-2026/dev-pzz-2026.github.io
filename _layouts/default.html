<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
  <style>
    :root {
      --ink: #2c2c2c;
      --ink-light: #5a5a5a;
      --ink-lighter: #999;
      --paper: #f5f0e8;
      --paper-dark: #ede6d8;
      --red: #b33a3a;
      --plum: #d4a5a5;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", Georgia, serif;
      color: var(--ink);
      background: var(--paper);
      line-height: 2;
      font-size: var(--fs, 16px);
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }
    /* 阅读偏好：字体与字号 */
    body[data-font="gb"] { font-family: SimSun, "宋体", "Noto Serif SC", serif; }
    body[data-font="fs"] { font-family: "仿宋_GB2312", FangSong_GB2312, "仿宋", FangSong, "FangSong SC", serif; }
    body[data-size="sm"] { --fs: 14px; }
    body[data-size="md"] { --fs: 16px; }
    body[data-size="lg"] { --fs: 18.5px; }
    /* 宣纸纹理 */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(ellipse at 20% 30%, rgba(180,160,130,0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 70%, rgba(180,160,130,0.06) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, rgba(200,180,150,0.04) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }
    /* 梅花枝桠背景 */
    .plum-branch {
      position: fixed;
      top: 0;
      right: 0;
      width: 420px;
      z-index: 1;
      pointer-events: none;
      opacity: 0.9;
      mix-blend-mode: multiply;
      -webkit-mask-image: radial-gradient(ellipse 120% 100% at 100% 0%, black 40%, transparent 100%);
      mask-image: radial-gradient(ellipse 120% 100% at 100% 0%, black 40%, transparent 100%);
      transform-origin: 100% 0%;
      animation: branch-sway 6s ease-in-out infinite;
    }
    @keyframes branch-sway {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(1.5deg); }
      50% { transform: rotate(0deg); }
      75% { transform: rotate(-1deg); }
    }
    nav {
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      width: 200px;
      z-index: 10;
      padding: 3rem 1.5rem;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--paper-dark);
    }
    nav .brand {
      font-size: 1.3rem;
      font-weight: 600;
      color: var(--ink);
      text-decoration: none;
      letter-spacing: 0.15em;
      margin-bottom: 3rem;
      writing-mode: horizontal-tb;
    }
    nav .links {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    nav .links a {
      color: var(--ink-light);
      text-decoration: none;
      font-size: 0.95rem;
      letter-spacing: 0.2em;
      transition: color 0.3s;
      padding-left: 0.5rem;
      border-left: 2px solid transparent;
    }
    nav .links a:hover, nav .links a.active {
      color: var(--red);
      border-left-color: var(--red);
    }
    nav .links .nav-label {
      color: var(--ink-lighter);
      font-size: 0.72rem;
      letter-spacing: 0.3em;
      padding-left: 0.5rem;
      margin-top: 0.5rem;
    }
    nav .links a.col-link { padding-left: 1.4rem; font-size: 0.9rem; }
    /* 阅读工具栏 */
    .toolbar {
      margin-top: auto;
      padding-top: 1.5rem;
      border-top: 1px solid var(--paper-dark);
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
      font-size: 0.8rem;
    }
    .toolbar label {
      color: var(--ink-lighter);
      letter-spacing: 0.05em;
      white-space: nowrap;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .toolbar select { flex: 1; min-width: 0; }
    .toolbar select, .toolbar button {
      font: inherit;
      font-size: 0.8rem;
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--paper-dark);
      border-radius: 2px;
      padding: 0.25rem 0.4rem;
      letter-spacing: 0.1em;
      cursor: pointer;
    }
    .toolbar button { width: 100%; }
    .toolbar button:hover, .toolbar select:hover { border-color: var(--red); color: var(--red); }
    main {
      position: relative;
      z-index: 10;
      max-width: 680px;
      margin-left: calc(240px + (100% - 240px - 680px) / 2);
      margin-right: auto;
      padding: 3rem 1.5rem;
    }
    h1 {
      font-size: 2rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      letter-spacing: 0.1em;
      writing-mode: horizontal-tb;
    }
    h2 {
      font-size: 1.2rem;
      font-weight: 600;
      margin: 2.5rem 0 1rem;
      color: var(--ink);
      letter-spacing: 0.05em;
    }
    h3 {
      font-size: 1.05rem;
      font-weight: 600;
      margin: 2rem 0 0.8rem;
      color: var(--ink);
      letter-spacing: 0.05em;
    }
    h4 {
      font-size: 0.98rem;
      font-weight: 600;
      margin: 1.6rem 0 0.6rem;
      color: var(--ink-light);
      letter-spacing: 0.05em;
    }
    p { margin-bottom: 1rem; color: var(--ink); }
    a { color: var(--red); text-decoration: none; }
    a:hover { text-decoration: underline; }
    /* 印章 */
    .seal {
      display: inline-block;
      width: 28px;
      height: 28px;
      background: var(--red);
      color: #fff;
      font-size: 0.7rem;
      line-height: 28px;
      text-align: center;
      border-radius: 3px;
      margin-left: 0.5rem;
      vertical-align: middle;
      font-family: "KaiTi", "STKaiti", serif;
    }
    /* 文章列表 */
    .post-list { margin-top: 2rem; }
    .post-item {
      padding: 1.3rem 0;
      border-bottom: 1px solid var(--paper-dark);
    }
    .post-item:last-child { border-bottom: none; }
    .post-item .title {
      font-size: 1.05rem;
      font-weight: 500;
      color: var(--ink);
      text-decoration: none;
      letter-spacing: 0.03em;
    }
    .post-item .title:hover { color: var(--red); }
    .post-item .meta {
      font-size: 0.8rem;
      color: var(--ink-lighter);
      margin-top: 0.4rem;
      letter-spacing: 0.05em;
    }
    .tag {
      display: inline-block;
      font-size: 0.72rem;
      color: var(--ink-light);
      background: var(--paper-dark);
      padding: 0.1rem 0.6rem;
      border-radius: 2px;
      margin-left: 0.6rem;
      letter-spacing: 0.05em;
    }
    blockquote {
      border-left: 2px solid var(--paper-dark);
      padding-left: 1.2rem;
      margin: 1.5rem 0;
      color: var(--ink-light);
      font-style: italic;
    }
    /* 分页 */
    .pagination {
      margin-top: 2.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      color: var(--ink-lighter);
    }
    .pagination a { color: var(--ink-light); }
    .pagination a:hover { color: var(--red); }
    footer {
      position: relative;
      z-index: 10;
      max-width: 680px;
      margin-left: calc(240px + (100% - 240px - 680px) / 2);
      margin-right: auto;
      padding: 2rem 1.5rem 3rem;
      text-align: center;
      color: var(--ink-lighter);
      font-size: 0.8rem;
      letter-spacing: 0.05em;
      border-top: 1px solid var(--paper-dark);
    }
    /* 飘落花瓣容器 */
    .petals {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 5;
      overflow: hidden;
    }
    .petal {
      position: absolute;
      top: -20px;
      font-size: 14px;
      color: var(--plum);
      opacity: 0;
      animation: petal-fall linear infinite;
    }
    @keyframes petal-fall {
      0% {
        transform: translateY(-20px) translateX(0) rotate(0deg);
        opacity: 0;
      }
      10% { opacity: 0.8; }
      90% { opacity: 0.6; }
      100% {
        transform: translateY(100vh) translateX(80px) rotate(360deg);
        opacity: 0;
      }
    }
    /* 移动端适配 */
    @media (max-width: 768px) {
      nav {
        position: relative;
        left: auto;
        top: auto;
        bottom: auto;
        width: 100%;
        padding: 1.5rem;
        flex-direction: row;
        justify-content: space-between;
        align-items: baseline;
        border-right: none;
        border-bottom: 1px solid var(--paper-dark);
      }
      nav .brand {
        margin-bottom: 0;
        font-size: 1.1rem;
      }
      nav .links {
        flex-direction: row;
        gap: 1.5rem;
      }
      nav .links a {
        padding-left: 0;
        border-left: none;
        font-size: 0.85rem;
        letter-spacing: 0.1em;
      }
      nav .links a:hover, nav .links a.active {
        border-left: none;
      }
      main {
        margin-left: 0;
        padding: 2rem 1.5rem;
      }
      footer {
        margin-left: 0;
      }
      .plum-branch {
        width: 200px;
        opacity: 0.4;
        top: auto;
        bottom: 0;
        right: -50px;
      }
      .toolbar { display: none; }
      nav .links .nav-label, nav .links a.col-link { display: none; }
    }
    /* 打印样式 */
    @media print {
      body { background: #fff; }
      body::before, .plum-branch, .petals, .toolbar { display: none !important; }
      nav { position: static; width: auto; border: none; padding: 0.5rem 0; flex-direction: row; }
      nav .links, nav .brand .seal { display: none; }
      nav .brand { margin: 0; font-size: 1rem; }
      main, footer { margin-left: 0; max-width: 100%; padding: 0.5rem 0; }
      a { color: inherit; text-decoration: none; }
      h1, h2, h3 { break-after: avoid; }
      .post-item, blockquote, p { break-inside: avoid; }
    }
  </style>
</head>
<body>
  <!-- 梅花枝桠SVG -->
  <img src="{{ '/assets/plum-branch.svg' | relative_url }}" alt="" class="plum-branch">

  <!-- 飘落花瓣 -->
  <div class="petals" id="petals"></div>

  <nav>
    <a href="{{ '/' | relative_url }}" class="brand">半夏叁分<span class="seal">印</span></a>
    <div class="links">
      <a href="{{ '/' | relative_url }}" {% if page.url == "/" %}class="active"{% endif %}>首页</a>
      <a href="{{ '/about/' | relative_url }}" {% if page.url contains "/about/" %}class="active"{% endif %}>关于</a>
      <a href="{{ '/blog/' | relative_url }}" {% if page.url contains "/blog/" %}class="active"{% endif %}>博客</a>
      <span class="nav-label">栏目</span>
      <a href="{{ '/columns/#%E5%8C%BB' | relative_url }}" class="col-link">医</a>
      <a href="{{ '/columns/#%E5%B7%A5' | relative_url }}" class="col-link">工</a>
      <a href="{{ '/columns/#%E8%89%BA' | relative_url }}" class="col-link">艺</a>
    </div>
    <div class="toolbar">
      <label>字体
        <select id="fontSel" aria-label="字体">
          <option value="cn">中文简体</option>
          <option value="tw">中文繁体</option>
          <option value="fs">仿宋GB2312</option>
        </select>
      </label>
      <label>字号
        <select id="sizeSel" aria-label="字号">
          <option value="sm">小</option>
          <option value="md">中</option>
          <option value="lg">大</option>
        </select>
      </label>
      <button id="printBtn" type="button">内容打印</button>
    </div>
  </nav>
  <main>
    {{ content }}
  </main>
  <footer>
    © {{ site.time | date: "%Y" }} {{ site.author.name }} · 舍岁余生
  </footer>

  <script src="{{ '/assets/opencc.full.js' | relative_url }}"></script>
  <script>
    // 阅读偏好：字体（简体/繁体/仿宋GB2312）、字号、打印
    (function() {
      var main = document.querySelector("main");
      var originalHTML = main.innerHTML;
      var convTW = null, convCN = null;
      try {
        convTW = OpenCC.Converter({ from: "cn", to: "t" });
        convCN = OpenCC.Converter({ from: "t", to: "cn" });
      } catch (e) {}

      function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
      function read(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

      var prefs = { font: read("bn-font") || "cn", size: read("bn-size") || "md" };

      function convertMain(mode) {
        var fn = mode === "tw" ? convTW : mode === "cn" ? convCN : null;
        if (!fn) { main.innerHTML = originalHTML; return; }
        var walker = document.createTreeWalker(main, NodeFilter.SHOW_TEXT);
        var nodes = [];
        while (walker.nextNode()) nodes.push(walker.currentNode);
        nodes.forEach(function (n) { n.nodeValue = fn(n.nodeValue); });
      }

      function apply() {
        var f = prefs.font, typeface = f === "fs" ? "fs" : "default";
        document.body.dataset.font = typeface;
        document.body.dataset.size = prefs.size;
        convertMain(f === "tw" ? "tw" : "cn");
        document.getElementById("fontSel").value = f;
        document.getElementById("sizeSel").value = prefs.size;
      }

      document.getElementById("fontSel").addEventListener("change", function () {
        prefs.font = this.value; store("bn-font", this.value); apply();
      });
      document.getElementById("sizeSel").addEventListener("change", function () {
        prefs.size = this.value; store("bn-size", this.value); apply();
      });
      document.getElementById("printBtn").addEventListener("click", function () {
        window.print();
      });
      apply();
    })();

    // 生成飘落花瓣和雪花
    (function() {
      const container = document.getElementById('petals');
      const petalCount = 10;
      const snowCount = 5;
      const symbols = ['❀', '❁', '❃'];
      for (let i = 0; i < petalCount; i++) {
        const petal = document.createElement('div');
        petal.className = 'petal';
        petal.textContent = symbols[Math.floor(Math.random() * symbols.length)];
        petal.style.left = Math.random() * 100 + '%';
        petal.style.animationDuration = (8 + Math.random() * 8) + 's';
        petal.style.animationDelay = (Math.random() * 10) + 's';
        petal.style.fontSize = (10 + Math.random() * 10) + 'px';
        container.appendChild(petal);
      }
      for (let i = 0; i < snowCount; i++) {
        const snow = document.createElement('div');
        snow.className = 'petal';
        snow.textContent = '❄';
        snow.style.left = Math.random() * 100 + '%';
        snow.style.animationDuration = (10 + Math.random() * 10) + 's';
        snow.style.animationDelay = (Math.random() * 15) + 's';
        snow.style.fontSize = (8 + Math.random() * 8) + 'px';
        snow.style.color = '#ccc';
        snow.style.opacity = '0.6';
        container.appendChild(snow);
      }
    })();
  </script>
</body>
</html>
